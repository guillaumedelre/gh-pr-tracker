<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Tracker</title>
    <script src="/config.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
            --blue: #58a6ff;
            --gray: #6e7681;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 0.75rem; font-weight: 600; }

        .header-right { display: flex; align-items: center; gap: 1rem; }

        /* ── Stats ── */
        .stats-bar {
            display: flex;
            gap: 0.75rem;
            padding: 1.25rem 2rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 100px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.875rem 1rem;
            text-align: center;
        }

        .stat-card .value { font-size: 1.875rem; font-weight: 700; line-height: 1; }
        .stat-card .label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.3rem; text-transform: uppercase; letter-spacing: .04em; }

        .stat-sub {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-top: 0.5rem;
            padding-top: 0.45rem;
            border-top: 1px solid var(--border);
        }

        .stat-sub-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .stat-sub-item .sub-val { font-weight: 600; }

        /* ── Filters ── */
        .filters {
            padding: 0 2rem;
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.75rem 1rem;
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
            margin-bottom: -1px;
        }

        .filter-btn:hover { color: var(--text); }

        .filter-btn[data-filter="open"]   { --fc: var(--blue);  }
        .filter-btn[data-filter="closed"] { --fc: var(--gray);  }
        .filter-btn[data-filter="merged"] { --fc: #a371f7;      }

        .filter-btn.active {
            color: var(--fc);
            border-bottom-color: var(--fc);
        }

        .f-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--fc);
            opacity: 0.45;
            transition: opacity 0.15s;
        }

        .filter-btn.active .f-dot { opacity: 1; }

        .f-count {
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 0.05rem 0.4rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 1.5rem;
            text-align: center;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .filter-btn.active .f-count {
            color: var(--fc);
            border-color: var(--fc);
            background: color-mix(in srgb, var(--fc) 12%, transparent);
        }

        /* ── Main ── */
        .main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

        /* ── Repo group ── */
        .repo-group { margin-bottom: 2rem; }

        .repo-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .repo-header a { color: var(--blue); text-decoration: none; font-weight: 600; }
        .repo-header a:hover { text-decoration: underline; }
        .repo-count { color: var(--text-muted); font-size: 0.875rem; }

        /* ── PR Card ── */
        .pr-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.875rem 1.25rem;
            margin-bottom: 0.5rem;
            display: grid;
            grid-template-columns: 130px 1fr auto;
            gap: 1rem;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s, background 0.15s;
        }

        .pr-card:hover { border-color: var(--blue); background: var(--surface2); }

        .pr-status { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem; }

        .pr-body .title { font-weight: 500; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 600px; }

        .pr-meta { display: flex; align-items: center; gap: 0.875rem; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }

        .pr-right { display: flex; align-items: center; gap: 0.75rem; }

        /* ── Badges ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-draft           { background: rgba(110,118,129,.15); color: var(--gray); border: 1px solid rgba(110,118,129,.3); }
        .badge-review          { background: rgba(210,153,34,.15);  color: var(--yellow); border: 1px solid rgba(210,153,34,.3); }
        .badge-changes         { background: rgba(248,81,73,.15);   color: var(--red);    border: 1px solid rgba(248,81,73,.3); }
        .badge-approved        { background: rgba(63,185,80,.15);   color: var(--green);  border: 1px solid rgba(63,185,80,.3); }
        .badge-merged          { background: rgba(163,113,247,.15); color: #a371f7;       border: 1px solid rgba(163,113,247,.3); }

        .ci-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .ci-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .ci-success { background: var(--green); }
        .ci-failure { background: var(--red); }
        .ci-pending { background: var(--yellow); }
        .ci-none    { background: var(--gray); }

        /* ── Avatars ── */
        .avatar { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); }
        .avatar-stack { display: flex; }
        .avatar-stack .avatar { margin-left: -6px; }
        .avatar-stack .avatar:first-child { margin-left: 0; }

        /* ── Buttons & Inputs ── */
        .btn {
            padding: 0.4rem 0.875rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .btn:hover { border-color: var(--blue); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* ── Spinner ── */
        .spinner-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 0; gap: 1rem; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Search ── */
        .search-input {
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.8rem;
            width: 200px;
            transition: border-color 0.15s, width 0.2s;
            outline: none;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--blue); width: 260px; }

        /* ── Misc ── */
        .hidden { display: none !important; }
        .diff-plus { color: var(--green); font-size: 0.75rem; }
        .diff-minus { color: var(--red); font-size: 0.75rem; }
        .error-msg { color: var(--red); font-size: 0.8rem; margin-top: 0.6rem; }

        code { background: var(--surface2); padding: 0.1em 0.3em; border-radius: 4px; font-size: 0.85em; }

        @media (max-width: 700px) {
            .pr-card { grid-template-columns: 1fr; }
            .stats-bar { gap: 0.5rem; }
            .stat-card .value { font-size: 1.5rem; }
            header { flex-direction: column; gap: 0.75rem; }
        }
    </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════ APP -->
<div id="app">

    <header>
        <div class="header-left">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="var(--blue)">
                <path d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
            </svg>
            PR Tracker
        </div>
        <div class="header-right">
            <div style="display:flex;align-items:center;gap:0.5rem">
                <img id="user-avatar" class="avatar" src="" alt="" style="width:26px;height:26px">
                <span id="user-login" style="font-size:0.8rem;color:var(--text-muted)"></span>
            </div>
            <span id="last-refresh" style="font-size:0.75rem;color:var(--text-muted)"></span>
            <button class="btn" id="notif-btn" onclick="requestNotifications()" title="Enable notifications">🔕</button>
            <button class="btn" id="refresh-btn" onclick="loadData()">⟳ Refresh</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="value" id="stat-total">-</div>
            <div class="label">Total open</div>
        </div>
        <div class="stat-card" style="border-color:rgba(110,118,129,.35)">
            <div class="value" id="stat-draft" style="color:var(--gray)">-</div>
            <div class="label">Draft</div>
        </div>
        <div class="stat-card" style="border-color:rgba(210,153,34,.35)">
            <div class="value" id="stat-review" style="color:var(--yellow)">-</div>
            <div class="label">In review</div>
            <div class="stat-sub">
                <div class="stat-sub-item">
                    <span>Changes</span>
                    <span class="sub-val" id="stat-changes" style="color:var(--red)">-</span>
                </div>
                <div class="stat-sub-item">
                    <span>Approved</span>
                    <span class="sub-val" id="stat-approved" style="color:var(--green)">-</span>
                </div>
            </div>
        </div>
        <div class="stat-card" style="border-color:rgba(110,118,129,.35)">
            <div class="value" id="stat-closed" style="color:var(--gray)">-</div>
            <div class="label" id="label-closed-year">Closed</div>
        </div>
        <div class="stat-card" style="border-color:rgba(163,113,247,.35)">
            <div class="value" id="stat-merged" style="color:#a371f7">-</div>
            <div class="label" id="label-merged-year">Merged</div>
        </div>
    </div>

    <div class="filters" style="justify-content:space-between">
        <div style="display:flex">
            <button class="filter-btn active" data-filter="open" onclick="setFilter('open', this)">
                <span class="f-dot"></span>Open<span class="f-count" id="fc-open">-</span>
            </button>
            <button class="filter-btn" id="filter-closed-btn" data-filter="closed" onclick="setFilter('closed', this)">
                <span class="f-dot"></span><span id="filter-closed-label">Closed</span><span class="f-count" id="fc-closed">-</span>
            </button>
            <button class="filter-btn" id="filter-merged-btn" data-filter="merged" onclick="setFilter('merged', this)">
                <span class="f-dot"></span><span id="filter-merged-label">Merged</span><span class="f-count" id="fc-merged">-</span>
            </button>
        </div>
        <div style="display:flex;align-items:center;padding:0 0.75rem">
            <input id="search-input" class="search-input" type="search" placeholder="Filter by repo, title or label…" oninput="setSearch(this.value)">
        </div>
    </div>

    <div class="main">
        <div id="loading" class="spinner-wrap hidden">
            <div class="spinner"></div>
            <span style="color:var(--text-muted);font-size:0.875rem">Loading PRs...</span>
        </div>
        <div id="pr-list"></div>
        <div id="empty-state" class="hidden" style="text-align:center;padding:5rem 0;color:var(--text-muted)">
            <div style="font-size:3rem;margin-bottom:1rem">🎉</div>
            <div style="font-size:1rem">No PRs for this filter.</div>
        </div>
        <div id="global-error" class="hidden" style="text-align:center;padding:4rem 0">
            <div style="font-size:2rem;margin-bottom:0.75rem">⚠️</div>
            <div id="global-error-msg" style="color:var(--red);font-size:0.875rem"></div>
            <button class="btn" style="margin-top:1rem" onclick="loadData()">Retry</button>
        </div>
    </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
